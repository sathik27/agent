<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Scotex</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050505;
    --surface:#121212;
    --surface-2:#1a1a1a;
    --border:#2c2c2c;
    --text:#f0f0ee;
    --muted:#8a8a88;
    --accent:#e6e6e3;
    --accent-dim:#6f6f6c;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#050505;
    color:var(--text);
    font-family:'Inter',Arial,sans-serif;
    min-height:100vh;
}

body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
    overflow-x:hidden;
    background:linear-gradient(160deg,#050505,#111111 45%,#1b1b1b 70%,#0a0a0a);
    background-size:300% 300%;
    animation:bgFade 18s ease-in-out infinite;
}

@keyframes bgFade{
    0%{ background-position:0% 30%; }
    50%{ background-position:100% 70%; }
    100%{ background-position:0% 30%; }
}

/* subtle film-grain texture, single quiet layer */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

body::after{
    content:"";
    position:fixed;
    top:-30%;
    left:50%;
    width:900px;
    height:900px;
    transform:translateX(-50%);
    background:radial-gradient(circle,rgba(255,255,255,0.06),transparent 60%);
    pointer-events:none;
    animation:glowFade 9s ease-in-out infinite;
}

@keyframes glowFade{
    0%,100%{ opacity:0.5; }
    50%{ opacity:1; }
}

.wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
}

.brand{
    text-align:center;
    margin-bottom:28px;
}

.brand h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:44px;
    letter-spacing:-0.02em;
    margin:0;
}

.brand p{
    margin:8px 0 0;
    color:var(--muted);
    font-size:14px;
}

.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:32px 28px;
    text-align:center;
}

.mic-row{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:6px 0 4px;
    height:120px;
}

.mic{
    position:relative;
    z-index:2;
    width:84px;
    height:84px;
    border:1px solid var(--border);
    border-radius:50%;
    font-size:30px;
    cursor:pointer;
    color:var(--text);
    background:radial-gradient(circle at 35% 30%,#262626,#141414 70%);
    transition:transform .15s ease, border-color .15s ease, background .3s ease;
    animation:breathe 3.6s ease-in-out infinite;
}

@keyframes breathe{
    0%,100%{
        box-shadow:0 0 0 0 rgba(255,255,255,0.05);
        transform:scale(1);
    }
    50%{
        box-shadow:0 0 0 10px rgba(255,255,255,0.03);
        transform:scale(1.03);
    }
}

.mic:hover{
    border-color:var(--accent-dim);
}

.mic:active{
    transform:scale(0.94);
}

.mic.listening{
    background:radial-gradient(circle at 35% 30%,#e6e6e3,#b9b9b6 75%);
    color:#141210;
    border-color:#dcdcd9;
    animation:pulse 1.4s ease-out infinite;
}

@keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,255,255,0.35); }
    100%{ box-shadow:0 0 0 26px rgba(255,255,255,0); }
}

/* expanding sound-wave rings spawned on click, grayscale fade */
.wave-ring{
    position:absolute;
    z-index:1;
    top:50%;
    left:50%;
    width:84px;
    height:84px;
    border-radius:50%;
    border:1px solid rgba(230,230,227,0.5);
    transform:translate(-50%,-50%) scale(1);
    opacity:0.8;
    pointer-events:none;
    animation:waveOut 1.1s ease-out forwards;
}

@keyframes waveOut{
    0%{
        transform:translate(-50%,-50%) scale(1);
        opacity:0.6;
        border-color:rgba(240,240,238,0.55);
    }
    100%{
        transform:translate(-50%,-50%) scale(2.6);
        opacity:0;
        border-color:rgba(120,120,118,0);
    }
}

.status{
    margin:16px 0 4px;
    color:var(--muted);
    font-size:14px;
    min-height:18px;
}

.command{
    color:var(--text);
    font-size:15px;
    font-weight:500;
    min-height:20px;
}

.editor{
    display:none;
    margin-top:22px;
    text-align:left;
    border-top:1px solid var(--border);
    padding-top:20px;
}

.recipient{
    color:var(--muted);
    font-size:13px;
    margin-bottom:6px;
}

label.field-label{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin:10px 0 4px;
}

input,
textarea{
    width:100%;
    padding:11px 12px;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:var(--accent-dim);
}

textarea{
    height:120px;
    resize:vertical;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:14px;
}

button.action{
    flex:1;
    padding:11px 14px;
    border:1px solid var(--border);
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    background:transparent;
    color:var(--text);
    transition:background .15s ease, border-color .15s ease;
}

button.action:hover{
    border-color:var(--accent-dim);
}

.primary{
    background:var(--accent);
    color:#141210;
    border-color:var(--accent);
}

.primary:hover{
    background:#e0b45f;
}

/* history */

.history-toggle{
    margin-top:18px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
}

.history-toggle:hover{
    color:var(--text);
}

.history{
    display:none;
    margin-top:16px;
    border-top:1px solid var(--border);
    padding-top:14px;
    text-align:left;
    max-height:220px;
    overflow-y:auto;
}

.history.open{
    display:block;
}

.history-empty{
    color:var(--muted);
    font-size:13px;
}

.history-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--border);
    font-size:13px;
}

.history-item:last-child{
    border-bottom:none;
}

.history-item .h-text{
    color:var(--text);
}

.history-item .h-meta{
    color:var(--muted);
    white-space:nowrap;
    font-size:11px;
}

.history-clear{
    margin-top:10px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    padding:0;
}

.history-clear:hover{
    color:var(--text);
}

</style>

</head>


<body>


<div class="wrap">

<div class="brand">
    <h1>SCOTEX</h1>
    <p>Say a song name, or ask it to draft an email</p>
</div>


<div class="card">


<div class="mic-row">
    <button
        id="mic"
        class="mic"
    >
        🎙️
    </button>
</div>


<div
    id="status"
    class="status"
>
    Tap the microphone
</div>


<div
    id="command"
    class="command"
></div>



<!-- Gmail Editor -->

<div
    id="editor"
    class="editor"
>


    <div
        id="recipient"
        class="recipient"
    ></div>


    <label class="field-label">Subject</label>

    <input
        id="subject"
        placeholder="Email subject"
    >


    <label class="field-label">Body</label>

    <textarea
        id="body"
        placeholder="Email body"
    ></textarea>


    <div class="actions">

        <button
            id="open"
            class="action primary"
        >
            Open in Gmail
        </button>


        <button
            id="regen"
            class="action"
        >
            Regenerate
        </button>

    </div>


</div>


<button id="historyToggle" class="history-toggle">Show history</button>

<div id="history" class="history">
    <div id="historyList"></div>
    <button id="historyClear" class="history-clear">Clear history</button>
</div>


</div>

</div>



<script>


// --------------------------------------------------
// DOM REFERENCES
// --------------------------------------------------

const $ =
    id => document.getElementById(id);


const mic =
    $("mic");


const status =
    $("status");


const commandBox =
    $("command");


const editor =
    $("editor");


const recipient =
    $("recipient");


const subject =
    $("subject");


const body =
    $("body");


const historyToggle =
    $("historyToggle");


const historyPanel =
    $("history");


const historyList =
    $("historyList");


const historyClear =
    $("historyClear");



// --------------------------------------------------
// SOUND EFFECTS (synthesized, no audio files needed)
// --------------------------------------------------

let audioCtx = null;

function getAudioCtx(){

    if(!audioCtx){

        audioCtx =
            new (window.AudioContext || window.webkitAudioContext)();

    }

    if(audioCtx.state === "suspended"){

        audioCtx.resume();

    }

    return audioCtx;

}


function playTone(freq, duration, type, gainValue){

    try{

        const ctx =
            getAudioCtx();


        const osc =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        osc.type =
            type || "sine";


        osc.frequency.value =
            freq;


        gain.gain.value =
            gainValue || 0.08;


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            ctx.currentTime + duration
        );


        osc.connect(gain);

        gain.connect(ctx.destination);


        osc.start();

        osc.stop(
            ctx.currentTime + duration
        );

    }
    catch(e){

        console.log(
            "Audio unavailable",
            e
        );

    }

}


// Short click when the mic button is pressed

function playClickSound(){

    playTone(
        720,
        0.06,
        "square",
        0.05
    );

}



// --------------------------------------------------
// FLOATING WAVE RINGS ON CLICK
// --------------------------------------------------

const micRow =
    $("mic").parentElement;


function spawnWaveRings(){

    const ringCount = 3;


    for(let i = 0; i < ringCount; i++){

        setTimeout(() => {

            const ring =
                document.createElement("span");


            ring.className =
                "wave-ring";


            micRow.appendChild(
                ring
            );


            ring.addEventListener(
                "animationend",
                () => ring.remove()
            );

        }, i * 180);

    }

}


// Rising tone when listening starts

function playStartSound(){

    playTone(
        480,
        0.12,
        "sine",
        0.07
    );


    setTimeout(
        () => playTone(
            720,
            0.1,
            "sine",
            0.06
        ),
        90
    );

}


// Descending tone when a result comes back

function playResultSound(){

    playTone(
        620,
        0.1,
        "sine",
        0.06
    );


    setTimeout(
        () => playTone(
            420,
            0.14,
            "sine",
            0.06
        ),
        100
    );

}



// --------------------------------------------------
// COMMAND HISTORY (persisted in localStorage)
// --------------------------------------------------

const HISTORY_KEY =
    "scotex_history";


function loadHistory(){

    try{

        return JSON.parse(
            localStorage.getItem(HISTORY_KEY)
        ) || [];

    }
    catch(e){

        return [];

    }

}


function saveHistory(entries){

    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(
            entries.slice(0, 20)
        )
    );

}


function addHistory(type, text, detail){

    const entries =
        loadHistory();


    entries.unshift({

        type,

        text,

        detail:
            detail || "",

        time:
            new Date().toLocaleString()

    });


    saveHistory(entries);


    renderHistory();

}


function renderHistory(){

    const entries =
        loadHistory();


    if(entries.length === 0){

        historyList.innerHTML =
            '<div class="history-empty">No commands yet.</div>';

        return;

    }


    historyList.innerHTML =
        entries.map(entry => {

            const icon =
                entry.type === "gmail"
                ? "✉️"
                : entry.type === "youtube"
                ? "🎵"
                : "❔";


            return (
                '<div class="history-item">' +
                    '<span class="h-text">' +
                        icon + " " + entry.text +
                    '</span>' +
                    '<span class="h-meta">' +
                        entry.time +
                    '</span>' +
                '</div>'
            );

        }).join("");

}


historyToggle.onclick = () => {

    const isOpen =
        historyPanel.classList.toggle("open");


    historyToggle.textContent =
        isOpen
        ? "Hide history"
        : "Show history";

};


historyClear.onclick = () => {

    localStorage.removeItem(
        HISTORY_KEY
    );


    renderHistory();

};


renderHistory();



// --------------------------------------------------
// SPEECH RECOGNITION
// --------------------------------------------------

const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition;

let listening = false;



// --------------------------------------------------
// COMMAND STATE
// --------------------------------------------------

let lastCommand = "";


// Prevent duplicate email generation

let emailGenerated = false;


// Prevent multiple requests at the same time

let generatingEmail = false;


// YouTube tab

let youtubeTab = null;



// --------------------------------------------------
// SPEECH RECOGNITION SETUP
// --------------------------------------------------

if(!SR){

    status.textContent =
        "Speech recognition unavailable";

    mic.disabled = true;

}
else{

    recognition =
        new SR();


    recognition.lang =
        "en-US";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;



    recognition.onstart = () => {

        listening = true;

        mic.classList.add(
            "listening"
        );

        status.textContent =
            "Listening...";


        playStartSound();

    };



    recognition.onend = () => {

        listening = false;

        mic.classList.remove(
            "listening"
        );

    };



    recognition.onerror = e => {

        listening = false;

        mic.classList.remove(
            "listening"
        );

        status.textContent =
            "Voice error: " +
            e.error;

    };



    recognition.onresult = e => {

        const text =
            e.results[0][0]
            .transcript
            .trim();


        if(!text){

            status.textContent =
                "No command detected";

            return;

        }


        lastCommand =
            text;


        commandBox.textContent =
            text;


        processCommand(
            text
        );

    };



    mic.onclick = () => {

        playClickSound();

        spawnWaveRings();


        if(listening)
            return;


        try{

            recognition.start();

        }
        catch(e){

            console.log(e);

        }

    };

}



// --------------------------------------------------
// GMAIL KEYWORD DETECTION
// --------------------------------------------------
//
// Gmail requires BOTH:
//
// create
// email
//
// Examples:
//
// "create email for my boss"
// "create an email for my manager"
//
// --------------------------------------------------

function isGmail(command){

    const hasCreate =
        /\bcreate\b/i.test(command);


    const hasEmail =
        /\bemail\b/i.test(command);


    return (
        hasCreate &&
        hasEmail
    );

}



// --------------------------------------------------
// YOUTUBE KEYWORD DETECTION
// --------------------------------------------------
//
// YouTube requires:
//
// play
//
// OR
//
// song
//
// Examples:
//
// "play believer"
// "play a song"
// "song believer"
//
// --------------------------------------------------

function isYouTube(command){

    return (
        /\bplay\b/i.test(command) ||
        /\bsong\b/i.test(command)
    );

}



// --------------------------------------------------
// MAIN COMMAND PROCESSOR
// --------------------------------------------------

async function processCommand(command){


    // ----------------------------------------------
    // CHECK COMMAND TYPE
    // ----------------------------------------------

    const gmail =
        isGmail(command);


    const youtube =
        isYouTube(command);



    // ----------------------------------------------
    // GMAIL COMMAND
    // ----------------------------------------------

    if(gmail){

        // Prevent duplicate generation

        if(generatingEmail){

            status.textContent =
                "Email is already being generated...";

            return;

        }


        // Prevent the same command from generating
        // another email

        if(
            emailGenerated &&
            command === lastCommand
        ){

            status.textContent =
                "Email already generated.";

            return;

        }


        generatingEmail = true;


        status.textContent =
            "Generating email...";


        try{


            const response =
                await fetch(
                    "/agent",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                command:command
                            })

                    }
                );



            const data =
                await response.json();



            if(
                !response.ok ||
                !data.success
            ){

                throw Error(
                    data.message ||
                    "Email request failed"
                );

            }



            // Show ONE generated email

            showEmail(
                data
            );


            emailGenerated = true;


            playResultSound();


            addHistory(
                "gmail",
                command,
                data.recipient || ""
            );


        }
        catch(error){

            console.error(
                error
            );


            status.textContent =
                error.message ||
                "Email generation failed";

        }
        finally{

            generatingEmail = false;

        }


        return;

    }



    // ----------------------------------------------
    // YOUTUBE COMMAND
    // ----------------------------------------------

    else if(youtube){

        status.textContent =
            "Finding song...";


        try{


            const response =
                await fetch(
                    "/youtube/play",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                command:command
                            })

                    }
                );



            const data =
                await response.json();



            if(
                !response.ok ||
                !data.success
            ){

                throw Error(
                    data.message ||
                    "YouTube request failed"
                );

            }



            playYouTube(
                data
            );


            playResultSound();


            addHistory(
                "youtube",
                command
            );


        }
        catch(error){

            console.error(
                error
            );


            status.textContent =
                error.message ||
                "YouTube request failed";

        }


        return;

    }



    // ----------------------------------------------
    // UNKNOWN COMMAND
    // ----------------------------------------------

    else{

        status.textContent =
            "Please say 'create email' or 'play song'.";

        return;

    }

}



// --------------------------------------------------
// SHOW GENERATED EMAIL
// --------------------------------------------------

function showEmail(data){


    recipient.dataset.email =
        data.recipient || "";


    recipient.textContent =
        data.recipient
        ? "To: " + data.recipient
        : "Recipient not specified";


    subject.value =
        data.subject || "";


    body.value =
        data.body || "";


    editor.style.display =
        "block";


    status.textContent =
        "Email ready. Review or edit it.";

}



// --------------------------------------------------
// OPEN GMAIL
// --------------------------------------------------

$("open").onclick = () => {


    const url =
        "https://mail.google.com/mail/u/0/?" +

        new URLSearchParams({

            view:"cm",

            fs:"1",

            to:
                recipient.dataset.email || "",

            su:
                subject.value,

            body:
                body.value

        });



    const win =
        window.open(
            url,
            "ScotexGmail"
        );



    if(!win){

        status.textContent =
            "Please allow popups for this site.";

    }

};



// --------------------------------------------------
// REGENERATE BUTTON
// --------------------------------------------------
//
// No automatic second generation.
//
// Clicking this button also does NOT call /agent.
// --------------------------------------------------

$("regen").onclick = () => {

    status.textContent =
        "Email already generated. Edit the existing email.";

};



// --------------------------------------------------
// YOUTUBE PLAYBACK
// --------------------------------------------------

function playYouTube(data){


    if(
        !youtubeTab ||
        youtubeTab.closed
    ){

        youtubeTab =
            window.open(
                data.url,
                "ScotexYouTube"
            );

    }
    else{

        youtubeTab.location.href =
            data.url;

        youtubeTab.focus();

    }


    status.textContent =
        "Playing";

}


</script>


</body>

</html>
